const steps=[{key:'place',tag:'01 / THE PLACE',title:'Where do you wanna go?',desc:'Thursday + Resident Evil + us. 🍿',choices:[['🌳','Downtown South Orange','~15–20 min from NJIT 🚕'],['🍿','Newport Centre Mall and Waterfront','~15–20 min from NJIT 🚕'],['🎟️','AMC Jersey Gardens Mall','~15–20 min from NJIT 🚕']]},{key:'food',tag:'02 / THE FOOD',title:'What are we eating? 🍕',desc:'I’m already hungry tbh',choices:[['🍕','Pizza together','Pizza sounds good to me'],['🍔','Burgers & fries','Can’t go wrong'],['🍣','Sushi date','Sushi? 👀'],['🍜','Noodles','Something warm'],['🌮','Tacos','Always down for tacos'],['🍗','Chicken & fries','Chicken + fries, easy']]},{key:'activity',tag:'03 / A LITTLE EXTRA',title:'What else should we do? ✨',desc:'Before or after the movie?',choices:[['🛍️','A little mall stroll','Wander around together'],['🍦','Ice cream after','A sweet ending']]},{key:'time',tag:'04 / THE MOVIE',title:'What time works for you?',desc:'Around 4 or later at night?',choices:[['🌤️','Around 4 PM','An afternoon movie date'],['🌙','Later at night','Evening movie vibes']]}];
let page=0;const answers={};const screen=document.querySelector('#screen');
const sideQuests=[{"name": "South Orange", "choices": [["☕", "Coffee + pastries", "Three Daughters Baking Co."], ["🌳", "Sit at Spiotta Park", "Just sit and talk for a bit"], ["🛍️", "Walk around downtown", "Check out the little shops"]], "urls": ["https://www.threedaughtersbakingco.com/", "https://www.southorange.org/facilities/facility/details/Spiotta-Park-11", "https://www.southorangedowntown.org/visit"]}, {"name": "Newport", "choices": [["🌃", "Walk by the water", "Hudson River Waterfront Walkway"], ["📸", "Take some pictures", "Water’s Soul + the skyline"], ["🌿", "Walk around Newport Green", "A park by the water"]], "urls": ["https://www.newportnj.com/neighborhood/hudson-river-waterfront-walkway-2/", "https://www.newportnj.com/the-waterfront/", "https://www.newportnj.com/the-waterfront/"]}, {"name": "Jersey Gardens", "choices": [["🕹️", "Play arcade games", "Round1 · I’m winning btw"], ["🎳", "Bowling together", "Round1 · loser owes the winner a snack"], ["🛍️", "Go shopping", "Walk around the outlets"]], "urls": ["https://www.round1usa.com/locations/062jsg", "https://www.round1usa.com/locations/062jsg", "https://www.simon.com/mall/the-mills-at-jersey-gardens"]}];

function showPerks(i,trigger){const content=[['🌳','Downtown South Orange','coffee, food, and a walk around downtown',['We can grab coffee or something to eat','Walk around the shops or sit at Spiotta Park','About 15–20 min from NJIT by car / Uber','No AMC here — I’m not sure what movies are showing locally']],['🌃','Newport Centre Mall and Waterfront','BEAUTIFUL BEAUTIFUL VIEWS 😭💜',['We can walk by the water and take pictures','AMC in the mall, then a walk over to the waterfront','About 15–20 min from NJIT by car / Uber']],['🛍️','AMC Jersey Gardens Mall','movie, food, and maybe the arcade?',['Round1 has arcade games and bowling','We can eat and walk around the shops too','About 15–20 min from NJIT by car / Uber']]][i];const d=document.createElement('dialog');d.className='perks-dialog';d.innerHTML=`<button class="close-perks" aria-label="Close location perks">✕</button><div class="perk-emoji">${content[0]}</div><span class="eyebrow">THE LITTLE PERKS</span><h2>${content[1]}</h2><p>${content[2]}</p><ul>${content[3].map(t=>`<li>💜 ${t}</li>`).join('')}</ul><button class="next pick-location">Let’s go here ♡</button>`;document.body.append(d);d.querySelector('.close-perks').onclick=()=>d.close();d.querySelector('.pick-location').onclick=()=>{setLocation(i);d.close();render();screen.querySelector(`[data-choice="${i}"]`).focus()};d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}});d.addEventListener('close',()=>{d.remove();if(trigger.isConnected)trigger.focus()});d.showModal()}
function focusTitle(){screen.querySelector('h1').focus({preventScroll:true})}
function summary(){return `It’s a date! 💜
Thursday · Resident Evil
📍 ${steps[0].choices[answers.place][1]}
🍴 ${steps[1].choices[answers.food][1]}
✨ ${steps[2].choices[answers.activity][1]}
🕓 ${steps[3].choices[answers.time][1]}
